name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Testar o motor de cálculo
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Compilar
        run: gradle :app:assembleDebug --no-daemon

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SatTransit-0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SatTransit-0.1.${{ github.run_number }}
          path: SatTransit-*.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: SatTransit 0.1.${{ github.run_number }}
          body: Versão de teste compilada automaticamente a partir de ${{ github.sha }}.
          prerelease: true
          files: SatTransit-*.apk
