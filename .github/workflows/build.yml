name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versão
        run: |
          base=$(tr -d ' \n' < VERSION)
          since=$(git log -1 --format=%H -- VERSION)
          patch=$(git rev-list --count "$since"..HEAD)
          echo "APP_VERSION=$base.$patch" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Testar o motor de cálculo
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Compilar
        run: gradle :app:assembleDebug --no-daemon

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SatTransit-${{ env.APP_VERSION }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SatTransit-${{ env.APP_VERSION }}
          path: SatTransit-*.apk

      - name: Notas da versão
        run: git log -1 --pretty=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session' > notes.md

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}.${{ github.run_number }}
          name: SatTransit ${{ env.APP_VERSION }}
          body_path: notes.md
          make_latest: "true"
          files: SatTransit-*.apk
